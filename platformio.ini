; ===========================================================================
; Metalio E-Ink 4 Plus — ESP32-S31NRV16, 4.7" ED047TC2 1216x684 PARALLEL
; ===========================================================================
; This is NOT the 3.97" Metalio E-Ink 4 above. That board is an ESP32-S3 with
; an SPI SSD1677 and CST816S touch; this one is an ESP32-S31 (RISC-V) with a
; RAW-PARALLEL ED047TC2 panel that has no controller IC at all, driven by the
; S31's LCD_CAM block with its rails from a TPS65185 PMIC. Nothing is reusable
; between the two board profiles, so they share no pins and no driver.
;
; Flash/PSRAM parameters are taken from the vendor's own binaries and sdkconfig,
; not guessed: both STOCKFW.bin and CrossLink Pixel.bin carry a bootloader at
; 0x2000 whose header reads chip ID 32 (ESP32-S31), DIO, 16 MB, 80 MHz, and the
; vendor sdkconfig pins octal PSRAM at 200 MHz. Getting any of these wrong is a
; bootloop, so they are all set explicitly below.
;
; The S31 target only exists in pioarduino 61.04.00-RC1 (IDF 6.1), which is why
; this env overrides [base]'s platform. The board JSON shipped with that
; platform says flash_mode qio and memory_type qio_opi — BOTH WRONG for this
; board. They are overridden here and again in custom_sdkconfig.
[metalio_eink4_plus_hardware]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = esp32-s31-coreboard-1
board_build.mcu = esp32s31
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; The app lives at 0x10000 on the device as shipped. Read back from the device
; itself (partition table at 0x8000) and what the vendor bootloader expects.
; STOCKFW.bin's release image uses a DIFFERENT layout (ota_0 at 0x80000, 'model'
; at 0x10000) -- do not mix them up.
board_upload.offset_address = 0x10000
; 16 MB quad flash in DIO + 16 MB octal PSRAM.
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.flash_size = 16MB
; The partition table is pinned in this repo on purpose: PlatformIO silently
; falls back to the platform's default_16MB.csv when this file is missing, which
; yields a correct-looking build with an accidental layout. A partition table is
; the one thing that can brick the device.
board_build.partitions = partitions.csv
lib_deps =
  ; NO BLE implementation (option D). NimBLE-Arduino 2.5.1's bundled NimBLE
  ; cannot coexist with ESP-IDF 6.1's: struct ble_npl_event resolves to IDF's
  ; definition while the .c comes from the Arduino bundle. Rather than keep
  ; patching headers, this env links no BLE stack. lib/BlePageTurner builds its
  ; NoRadio.cpp path (BoardConfig.h forces the capability to 0 for this board), and the SDK's
  ; BleKeyboardHost HEADERS are on the include path only so BleKeyBinding.h
  ; can name its enums. Reinstate BLE once NimBLE/IDF-6.1 is solved.
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  HapticManager=symlink://freeink-sdk/libs/hardware/HapticManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  UsbMassStorage=symlink://freeink-sdk/libs/hardware/UsbMassStorage
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  MemoryManager=symlink://freeink-sdk/libs/hardware/MemoryManager
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  JsonSax=symlink://freeink-sdk/libs/network/JsonSax
  Opds=symlink://freeink-sdk/libs/network/Opds
  CatalogList=symlink://freeink-sdk/libs/network/CatalogList
  ContentProtection=symlink://freeink-sdk/libs/book/ContentProtection
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  bblanchon/ArduinoJson @ 7.4.2
  greiman/SdFat @ 2.3.1
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  https://github.com/bitbank2/AnimatedGIF.git#67cfacafe12ef4926c7713342c57d2a4af040e5e
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2
extra_scripts =
  ${base.extra_scripts}
  ; C23 (GCC 15 on the S31) makes bool/true/false keywords, which breaks
  ; ricmoo/QRCode's `typedef unsigned char bool;`. Scoped patch; does NOT
  ; downgrade the C standard, because IDF 6.1's headers need C23's bool.
  pre:scripts/patch_qrcode.py
build_unflags =
  ${base.build_unflags}
  ; [base] pulls -DFREEINK_CAP_BLE_HID_HOST=1 from [ble_page_turner]'s build_flags.
  ; SdkRadio.cpp tests that macro BEFORE any header runs, so a #undef inside
  ; BoardConfig.h cannot reach it -- and appending -U/-D here loses the ordering
  ; fight against the inherited flag. build_unflags removes the flag outright,
  ; which leaves the macro undefined -> 0 -> NoRadio.cpp is the only port built.
  -DFREEINK_CAP_BLE_HID_HOST=1
  -fno-lto
custom_sdkconfig =
  CONFIG_IDF_TARGET="esp32s31"
  ; DIAGNOSTIC: the FACTORY bootloader brings up USB-Serial/JTAG for its own logs
  ; and leaves it running. Arduino's HWCDC then tries to claim the same peripheral
  ; and hangs -- which is exactly the "frontlight on, no port, no buzz" signature.
  ; Let IDF's console own USB instead; log with printf(), never Serial.begin().
  CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
  CONFIG_ESP_CONSOLE_SECONDARY_NONE=y
  CONFIG_ESP_CONSOLE_UART_BAUDRATE=115200
  CONFIG_ESP_CONSOLE_UART_NUM=0
  ; Store config from the vendor's sdkconfig.
  CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
  CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
  CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_SPIRAM_SPEED_200M=y
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_320=y
  ; Panel-with-no-controller reality: the LCD_CAM path needs internal DMA
  ; bounce buffers and a phase table, so keep the vendor's internal reservation.
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
  ; PowerManager.cpp calls esp_sleep_config_gpio_isolate(), which IDF 6.1 only
  ; compiles when CONFIG_ESP_SLEEP_GPIO_RESET_WORKAROUND or
  ; CONFIG_PM_SLP_DISABLE_GPIO is set (esp_hw_support/sleep_gpio.c:122).
  ; The vendor sdkconfig ships RESET_WORKAROUND explicitly DISABLED, so it must
  ; be re-enabled here. PM_SLP_DISABLE_GPIO is NOT usable on its own: it depends
  ; on FREERTOS_USE_TICKLESS_IDLE, which this build does not enable, so Kconfig
  ; silently drops it (that was build39's remaining failure).
  CONFIG_ESP_SLEEP_GPIO_RESET_WORKAROUND=y
  CONFIG_COMPILER_CXX_EXCEPTIONS=n
  ; NO BT in this build: BLE is stubbed out (option D). CONFIG_BT_ENABLED
  ; stays unset, so IDF builds no NimBLE and nothing can collide with it.
build_flags =
  ${base.build_flags}
  ; NO -flto here, deliberately. With LTO the S31 link failed to resolve
  ; app_main (defined as `T app_main` inside libframework-arduinoespressif32.a)
  ; and psa_crypto_init from mbedtls, even though both archives are inside the
  ; --start-group. Dropping LTO for this env is the cheap way to tell an LTO
  ; archive/plugin problem from a real missing symbol.
  -DFREEINK_DEVICE_METALIO_EINK4_PLUS=1
  ; mbedTLS 4.x / TF-PSA-Crypto ships no public mbedtls/sha256.h. This dir holds
  ; compat/include/crosspoint_sha256.h, a PSA-backed streaming SHA-256 used by the
  ; firmware flashers. This is the header in use.
  -I$PROJECT_DIR/compat/include
  -I$PROJECT_DIR/compat/include
  ; Waveform LUTs live with the app (src/display), but the driver that consumes them is
  ; in freeink-sdk -- the SDK cannot see the app's src/ without this.
  -I$PROJECT_DIR/src/display
  ; No BLE stack linked (see lib_deps): keep lib/BlePageTurner on NoRadio.cpp.
  ; Headers only -- BleKeyBinding.h includes BleRemoteProfiles.h for its enums.
  -I$PROJECT_DIR/freeink-sdk/libs/network/BleKeyboardHost/include
  ; ESP-IDF 6.1 on this RISC-V target links the toolchain's libgloss libnosys
  ; sbrk.c (via the nano specs), and that object references `end`. IDF's own
  ; linker templates stopped defining `end` -- components/esp_system/ld/
  ; ld.heap.sections provides only `_heap_start`, and there is no PROVIDE(end)
  ; anywhere in the esp32s31 templates. Without this the image fails to link
  ; with "undefined reference to `end'" from sbrk.c. `_heap_start` is the
  ; semantically correct value: newlib's sbrk bumps from the end of .bss, which
  ; is exactly where IDF's heap begins.
  -Wl,--defsym=end=_heap_start
  ; BLE HOST is not built (option D): no NimBLE-Arduino, no BlePageTurner radio.
  ; BUT esp32-hal-bt.c includes <esp_bt.h> with NO #if guard, so the BT headers are
  ; still parsed. The vendor's ble_user_cfg.h reads these three Kconfig symbols
  ; unconditionally (ble_user_cfg.h:323-326) and the vendor sdkconfig never defines
  ; them, so they are defaulted here. They only shape a BT controller we never
  ; initialise. Note the package's own bt/ headers are used, not IDF's -- that is
  ; why the extra -I dirs from the NimBLE attempt stay removed (they made esp_bt.h
  ; resolve to IDF's copy, which demands a generated syscfg/syscfg.h).
  -DCONFIG_BT_LE_DFT_SYNC_SCHED_PRIO_LEVEL=0
  -DCONFIG_BT_LE_DFT_PERIODIC_ADV_SCHED_PRIO_LEVEL=0
  -DCONFIG_BT_LE_DFT_ADV_SCHED_PRIO_LEVEL=0
  -DBOARD_HAS_PSRAM
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DARDUINO_USB_MODE=1
  -DCP_LOG_VIA_PRINTF
  -DUSB_PRODUCT=\"CrossPoint_Metalio_EInk4Plus\"
  -DUSB_MANUFACTURER=\"CrossPoint\"

[env:metalio_eink4_plus]
extends = metalio_eink4_plus_hardware
build_flags =
  ${metalio_eink4_plus_hardware.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-metalio-eink4-plus\"
  -DENABLE_SERIAL_LOG
  -DCP_CONSOLE_ONLY  ; REQUIRED on this board: HWCDC Serial.begin() hangs because the IDF
                     ; bootloader owns USB-Serial/JTAG. Logs go via printf to the IDF console.
  -DLOG_LEVEL=2
  ; ESP32-S31 PMA fix: src/esp32s31_region_protect_override.c re-implements
  ; esp_cpu_configure_region_protection() because the prebuilt IDF archive's copy does not map
  ; PSRAM at 0x50000000, which reset-loops the app. Under LTO both definitions reach the linker
  ; ("multiple definition"), and ours is listed first, so allow the duplicate and keep ours.
  ; Verified after link with: nm firmware.elf | grep esp_cpu_configure_region_protection
  -Wl,--allow-multiple-definition
  ; BUILD FIX (needed for any clean build): lib/Logging/Logging.cpp includes HalStorage.h, which
  ; includes <common/FsApiConstants.h>. LDF resolves SdFat from HalStorage.cpp but not from
  ; Logging.cpp (it does not chase a nested include of another lib's header), so the library fails
  ; with "common/FsApiConstants.h: No such file or directory" unless SdFat's src dir is on the path.
  ; Incremental builds hid this because Logging.cpp.o was never recompiled.
  -I.pio/libdeps/metalio_eink4_plus/SdFat/src
  ; (r97) The src/vendor_epd include block that stood here was deleted with the tree itself.
  ; Nothing compiled it: CP_VENDOR_EPD / CP_VENDOR_EARLY are defined nowhere, the IDF build
  ; excludes /vendor_epd/ from its source glob, and idf/components/metalio_driver carries the
  ; vendor display sources that actually run. The paths pointed at files that no longer exist.
